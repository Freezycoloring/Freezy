<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freezy · Colour Chart Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sue+Ellen+Francisco&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5ea;--panel:#fffdf8;--ink:#4c301c;--mute:#7a6452;--line:#ecdcc6;--teal:#8e6b87;--tealink:#fff;--purple:#8a6bb8;--green:#3f9080;--coral:#e98f7c;--sand:#e3b98a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1710;--panel:#2a2016;--ink:#f3e6d3;--mute:#c4ad94;--line:#46372a}}
:root[data-theme="dark"]{--bg:#1f1710;--panel:#2a2016;--ink:#f3e6d3;--mute:#c4ad94;--line:#46372a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background-image:radial-gradient(circle at 12% 8%,rgba(142,107,135,.18),transparent 38%),radial-gradient(circle at 92% 4%,rgba(138,107,184,.14),transparent 34%)}
main{max-width:1000px;margin:0 auto;padding:26px 18px 44px;display:grid;gap:26px;grid-template-columns:minmax(0,330px) minmax(0,1fr);align-items:start}
@media (max-width:760px){main{grid-template-columns:1fr}}
.hero{grid-column:1/-1;display:flex;align-items:center;gap:18px}
.lg{width:104px;height:104px;flex:none}
h1{font:400 clamp(40px,8vw,64px)/.95 "Sue Ellen Francisco","Segoe Print",cursive;margin:0;color:var(--teal)}
.by{margin:4px 0 0;font:400 28px/1 "Sue Ellen Francisco","Segoe Print",cursive;color:var(--ink)}
.sp{font-size:18px;margin-left:8px}.s1{color:var(--purple)}.s2{color:var(--green)}.s3{color:var(--coral)}
p{margin:0 0 18px;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:16px;padding:20px;box-shadow:0 6px 18px rgba(76,48,28,.1)}
label{display:block;font-weight:700;margin-bottom:6px}
input{width:100%;font:inherit;font-size:30px;padding:8px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--panel);color:var(--ink)}
button,.tt{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;font:inherit;font-weight:700;padding:13px;border-radius:999px;cursor:pointer;text-decoration:none}
button{border:2px solid var(--teal);background:var(--teal);color:var(--tealink)}
button.alt{background:transparent;color:var(--ink);border-color:var(--purple)}
.tt{background:#000;color:#fff;border:2px solid #000;box-shadow:3px 3px 0 #25f4ee,-3px -3px 0 #fe2c55;margin-top:22px}
.tt svg{width:20px;height:20px;fill:#fff}
hr{border:0;border-top:2px dashed var(--line);margin:20px 0 0}
button:focus-visible,input:focus-visible,.tt:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.info,#msg{font-size:14px;color:var(--mute);margin-top:12px;min-height:1.4em}
.paper{background:#fff;border-radius:6px;box-shadow:0 6px 22px rgba(76,48,28,.28);line-height:0;overflow:hidden}
canvas{width:100%;height:auto;display:block}
</style>
</head>

  c.fillStyle='#000';c.strokeStyle='#000';c.lineCap='butt';
  const m=W*.09;
  c.fillStyle='#8e6b87';c.textAlign='center';c.font=`${W*.062}px ${FONT}`;
  c.fillText('Colour Chart',W/2,H*.085);
  c.fillStyle='#4c301c';c.textAlign='left';c.font=`${W*.027}px ${FONT}`;
  c.fillText(n+' Color Swatch',m,H*.1);
  const ls=W*.115;
  if(logoOk)c.drawImage(logo,W-m-ls,H*.032,ls,ls);
  const gy=H*.165,gw=W-2*m,gh=H*.77;
  let b=null;
  for(let k=1;k<=n;k++){
    const r=Math.ceil(n/k),w=gw/k,h=Math.min(gh/r,w*1.25),s=Math.min(w/.94,h);
    if(!b||s>b.s+1e-9)b={k,r,w,h,s};
  }
  grid=b;
  const bw=Math.min(b.w*.5,b.h*.62),bh=bw*.8;
  c.lineWidth=Math.max(W*.0016,bw*.075);
  for(let i=0;i<n;i++){
    const x0=m+(i%b.k)*b.w,y0=gy+Math.floor(i/b.k)*b.h,cx=x0+b.w/2;
    c.strokeRect(cx-bw/2,y0+b.h*.1,bw,bh);
    c.beginPath();c.moveTo(cx-b.w*.43,y0+b.h*.8);c.lineTo(cx+b.w*.43,y0+b.h*.8);c.stroke();
  }
  c.fillStyle='#4c301c';c.textAlign='center';c.font=`${W*.0165}px ${FONT}`;
  c.fillText(FOOTER,W/2,H*.972);
}

function render(){
  const n=count();
  draw(cv.getContext('2d'),cv.width,cv.height,n);
  $('info').textContent=n+' colours, laid out '+grid.k+' across by '+grid.r+' down.';
}

function say(t){$('msg').textContent=t}

async function out(blob,name){
  if(dl){
    try{await dl.save({filename:name,data:blob});say('Ready: '+name)}
    catch(e){if(e&&e.code!=='declined')say('Couldn’t save the file. Please try again.')}
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  say('Downloaded '+name);
}

function hires(){
  const n=count(),c=document.createElement('canvas');
  c.width=2480;c.height=3508;
  draw(c.getContext('2d'),2480,3508,n);
  render();
  return {c,n};
}

$('png').onclick=async()=>{
  const {c,n}=hires();
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  out(blob,'colour-chart-'+n+'.png');
};
$('pdf').onclick=async()=>{
  const {c,n}=hires();
  try{
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
    pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,210,297,undefined,'FAST');
    out(pdf.output('blob'),'colour-chart-'+n+'.pdf');
  }catch(e){say('PDF tools didn’t load. Try the PNG download instead.')}
};

$('lg').src=LOGO;inp.addEventListener('input',render);
render();
(document.fonts&&document.fonts.load('40px "Sue Ellen Francisco"')||Promise.resolve()).then(render,render);
if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
</script>
